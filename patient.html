table{width:100%;border-collapse:collapse;font-size:13px;}th{text-align:left;padding:10px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-500);border-bottom:1px solid var(--ink-200);background:var(--ink-50);}td{padding:10px 12px;border-bottom:1px solid var(--ink-100);}tr:hover td{background:var(--primary-50);}

</style>

function showScreen(name) {
  const content = document.getElementById('screen-content');
  const title = document.getElementById('page-title');
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navItem = document.querySelector(`.nav-item[data-screen="${name}"]`);
  if (navItem) navItem.classList.add('active');
  if (SCREENS[name]) content.innerHTML = SCREENS[name]();
  title.textContent = name.replace(/-/g,' ').replace(/\b\w/g, c => c.toUpperCase());
}
document.querySelectorAll('.nav-item[data-screen]').forEach(item => {
  item.addEventListener('click', () => showScreen(item.dataset.screen));
});
showScreen('dashboard');
</script>
