<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rx Pharmacy - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, sans-serif; min-height: 100vh; background: linear-gradient(160deg, #e8eaf6 0%, #f5f5f5 100%); display: flex; align-items: center; justify-content: center; }
.login-card { background: #fff; border-radius: 14px; box-shadow: 0 8px 40px rgba(26,35,126,0.08); padding: 40px 36px; width: 400px; max-width: 92vw; }
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
.brand-icon { width: 40px; height: 40px; background: #1a237e; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 15px; }
.brand-name { font-size: 20px; font-weight: 800; color: #1a1a2e; letter-spacing: -0.3px; }
.brand-sub { font-size: 12px; color: #777; font-weight: 500; }
.section-header { background: #1a237e; color: #fff; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; padding: 9px 16px; border-radius: 8px; margin-bottom: 20px; }
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 11px; font-weight: 600; color: #555; margin-bottom: 5px; }
.form-input { width: 100%; border: 1px solid #e0e0e0; border-radius: 8px; padding: 11px 14px; font-size: 14px; outline: none; }
.form-input:focus { border-color: #1565c0; box-shadow: 0 0 0 3px rgba(21,101,192,0.1); }
.btn-primary { width: 100%; background: #1a237e; color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 20px; transition: background 0.15s; }
.btn-primary:hover { background: #283593; }
.demo-note { text-align: center; font-size: 11px; color: #aaa; margin-top: 12px; }
</style>
</head>
<body>
<div class="login-card">
  <div class="brand">
    <div class="brand-icon">R</div>
    <div>
      <div class="brand-name">Rx Pharmacy</div>
      <div class="brand-sub">Management System</div>
    </div>
  </div>
  <div class="section-header">PHARMACY STAFF SIGN IN</div>
  <form>
    <div class="form-group">
      <label class="form-label">Username</label>
      <input class="form-input" type="text" value="admin">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-input" type="password" value="admin">
    </div>
    <button class="btn-primary" type="button" onclick="window.location='overview.html'">Enter Dashboard &rarr;</button>
  </form>
  <div class="demo-note">Demo: any credentials work</div>
</div>
</body>
</html>
