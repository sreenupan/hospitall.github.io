<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rx Pharmacy - Online Orders</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, sans-serif; background: #f5f5f5; color: #1a1a2e; font-size: 14px; }
.header { background: #1a237e; color: #fff; padding: 0 20px; height: 44px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.header-brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
.header-brand .icon { width: 26px; height: 26px; background: #3949ab; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; }
.header-version { font-size: 9px; background: rgba(255,255,255,0.15); padding: 2px 7px; border-radius: 10px; margin-left: 6px; }
.header-actions { display: flex; gap: 6px; }
.header-actions button { border: none; border-radius: 6px; padding: 5px 12px; font-size: 11px; font-weight: 600; cursor: pointer; }
.btn-export { background: #4caf50; color: #fff; }
.btn-import { background: #4caf50; color: #fff; }
.btn-reset { background: #ffc107; color: #333; }
.btn-logout { background: #f44336; color: #fff; }
.nav { display: flex; gap: 0; padding: 6px 16px; background: #fff; border-bottom: 1px solid #e0e0e0; overflow-x: auto; position: sticky; top: 44px; z-index: 90; }
.nav a { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; color: #555; text-decoration: none; white-space: nowrap; }
.nav a.active { background: #1565c0; color: #fff; font-weight: 600; }
.nav a:hover:not(.active) { background: #f0f0f0; }
.content { padding: 16px 20px; margin: 0 auto; }
.page-title { font-size: 16px; font-weight: 800; margin-bottom: 14px; }
.card { background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
.card-header { padding: 12px 18px; font-size: 12px; font-weight: 700; color: #333; border-bottom: 1px solid #f0f0f0; text-transform: uppercase; letter-spacing: 0.04em; }
.card-body { padding: 16px 18px; }
.btn-simulate { background: #43a047; color: #fff; border: none; border-radius: 6px; padding: 9px 18px; font-size: 12px; font-weight: 600; cursor: pointer; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { text-align: left; padding: 9px 14px; font-size: 10px; font-weight: 600; color: #777; border-bottom: 1px solid #eee; }
td { padding: 9px 14px; border-bottom: 1px solid #f5f5f5; }
.empty-state { text-align: center; padding: 36px; color: #bbb; font-size: 12px; }
.row-count { padding: 10px 14px; font-size: 11px; color: #aaa; border-top: 1px solid #f0f0f0; }
</style>
</head>
<body>
<div class="header"><div class="header-brand"><div class="icon">Rx</div>Pharmacy Admin<span class="header-version">v1.0</span></div><div class="header-actions"><button class="btn-export">&#9650; Export</button><button class="btn-import">&#9660; Import</button><button class="btn-reset">&#8634; Reset</button><button class="btn-logout">Logout</button></div></div>
<div class="nav"><a href="overview.html" class="active">Overview</a><a href="products.html">Products</a><a href="suppliers.html">Suppliers</a><a href="customers.html">Customers</a><a href="sales.html">Sales</a><a href="purchases.html">Purchases</a><a href="returns.html">Returns</a><a href="damages.html">Damages</a><a href="stock-adjustments.html">Stock Adj.</a><a href="reports.html">Reports</a><a href="prescription-dispense.html">Rx Dispense</a></div>
<div class="content">
  <div class="page-title">Online Orders</div>
  <div class="card">
    <div class="card-header">Simulate New Online Order</div>
    <div class="card-body">
      <button class="btn-simulate">Simulate Customer Order</button>
    </div>
  </div>
  <div class="card">
    <div class="card-header">Online Orders</div>
    <table>
      <thead><tr><th>Order #</th><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr></thead>
      <tbody><tr><td colspan="6" class="empty-state">No online orders yet</td></tr></tbody>
    </table>
    <div class="row-count">Showing 0 of 0 rows</div>
  </div>
</div>
</body>
</html>
