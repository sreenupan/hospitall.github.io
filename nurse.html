<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HospitAll - Nurse Role Prototype (Developer Reference)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--primary:#2563EB;--primary-dark:#1D4ED8;--primary-50:#EFF6FF;--primary-100:#DBEAFE;--success:#16A34A;--success-50:#F0FDF4;--success-100:#DCFCE7;--warning:#D97706;--warning-50:#FFFBEB;--warning-100:#FEF3C7;--danger:#DC2626;--danger-50:#FEF2F2;--danger-100:#FEE2E2;--violet:#7C3AED;--violet-50:#F5F3FF;--teal:#0D9488;--teal-50:#F0FDFA;--ink-900:#0F172A;--ink-700:#334155;--ink-500:#64748B;--ink-400:#94A3B8;--ink-300:#CBD5E1;--ink-200:#E2E8F0;--ink-100:#F1F5F9;--ink-50:#F8FAFC;--white:#FFFFFF;--radius:10px;--font-ui:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--font-data:'IBM Plex Mono',ui-monospace,monospace;}
*{box-sizing:border-box;margin:0;padding:0;}body{font-family:var(--font-ui);background:var(--ink-50);color:var(--ink-900);font-size:14px;}a{text-decoration:none;color:inherit;}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;}
.nav{background:linear-gradient(180deg,#1E3A8A 0%,#1E40AF 100%);color:#fff;display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;}.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 22px;}.brand-icon{width:34px;height:34px;background:rgba(255,255,255,.15);border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}.brand-name{font-weight:700;font-size:15.5px;}.nav-section{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.4);padding:16px 12px 6px;}.nav-item{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;color:rgba(255,255,255,.78);font-weight:500;font-size:13.5px;cursor:pointer;margin-bottom:2px;position:relative;}.nav-item:hover{background:rgba(255,255,255,.08);color:#fff;}.nav-item.active{background:rgba(255,255,255,.16);color:#fff;font-weight:600;}.nav-item.active::before{content:'';position:absolute;left:-14px;top:8px;bottom:8px;width:3px;background:#fff;border-radius:2px;}.nav-badge{margin-left:auto;background:#EF4444;color:#fff;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:99px;}.nav-spacer{flex:1;}.switch-role{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:10px 12px;color:#fff;font-size:12px;cursor:pointer;text-align:center;font-weight:600;}
.main{display:flex;flex-direction:column;min-height:100vh;}.topbar{display:flex;align-items:center;gap:16px;padding:14px 28px;background:#fff;border-bottom:1px solid var(--ink-200);position:sticky;top:0;z-index:20;}.topbar-title{font-size:16px;font-weight:700;}.topbar-spacer{flex:1;}.avatar{width:36px;height:36px;border-radius:9px;background:var(--success);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;}
.card{background:#fff;border:1px solid var(--ink-200);border-radius:var(--radius);padding:20px;margin-bottom:16px;}.card-title{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px;}.stat-card{background:#fff;border:1px solid var(--ink-200);border-radius:var(--radius);padding:16px;text-align:center;}.stat-value{font-size:28px;font-weight:800;font-family:var(--font-data);color:var(--primary);}.stat-label{font-size:12px;color:var(--ink-500);font-weight:600;margin-top:4px;}
table{width:100%;border-collapse:collapse;font-size:13px;}th{text-align:left;padding:10px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-500);border-bottom:1px solid var(--ink-200);background:var(--ink-50);}td{padding:10px 12px;border-bottom:1px solid var(--ink-100);}tr:hover td{background:var(--primary-50);}
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:700;}.badge-blue{background:var(--primary-50);color:var(--primary);}.badge-green{background:var(--success-50);color:var(--success);}.badge-yellow{background:var(--warning-50);color:var(--warning);}.badge-red{background:var(--danger-50);color:var(--danger);}.badge-gray{background:var(--ink-100);color:var(--ink-500);}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;font-weight:600;font-size:13px;padding:9px 15px;cursor:pointer;border:1px solid transparent;white-space:nowrap;}.btn-primary{background:var(--primary);color:#fff;}.btn-ghost{background:#fff;border-color:var(--ink-200);color:var(--ink-700);}.btn-success{background:var(--success);color:#fff;}.btn-sm{padding:6px 10px;font-size:12px;}
.form-group{margin-bottom:14px;}.form-label{display:block;font-size:12px;font-weight:600;color:var(--ink-700);margin-bottom:6px;}.form-control{width:100%;border:1px solid var(--ink-200);border-radius:8px;padding:9px 12px;font-size:13px;font-family:var(--font-ui);color:var(--ink-900);background:#fff;outline:none;}.form-control:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-100);}select.form-control{appearance:auto;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}.form-row-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;}
.page-header{display:flex;align-items:center;gap:14px;margin-bottom:20px;}.page-title-lg{font-size:22px;font-weight:800;}.header-spacer{flex:1;}
.new-feature{position:relative;border:2px dashed #DC2626 !important;opacity:0.6;}.new-feature::after{content:'NEW - Not in current code';position:absolute;top:-10px;right:10px;background:#DC2626;color:#fff;font-size:9px;font-weight:700;padding:2px 8px;border-radius:4px;z-index:5;}
</style>
</head>
<body>
<div class="app">
<nav class="nav">
  <div class="brand"><div class="brand-icon">H</div><div class="brand-name">HospitAll</div></div>

<main class="main">

v></div>
  <div id="screen-content" style="flex:1;padding:24px 28px;"></div>
</main>
</div>

function showScreen(name) {
  const content = document.getElementById('screen-content');
  const title = document.getElementById('page-title');
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navItem = document.querySelector(`.nav-item[data-screen="${name}"]`);
  if (navItem) navItem.classList.add('active');
  if (SCREENS[name]) content.innerHTML = SCREENS[name]();
  title.textContent = name.replace(/-/g,' ').replace(/\b\w/g, c => c.toUpperCase());
}
document.querySelectorAll('.nav-item[data-screen]').forEach(item => {
  item.addEventListener('click', () => showScreen(item.dataset.screen));
});
showScreen('dashboard');
</script>
